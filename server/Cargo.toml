[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
croner = "4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
icalendar = "0.17"
mlua = { version = "0.12", features = ["luau", "async", "serialize", "send"] }
notify = "8"
redis = { version = "1", features = ["tokio-comp", "aio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
